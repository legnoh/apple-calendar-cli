name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true
        default: 'v0.0.1'

jobs:
  build-and-release:
    runs-on: macos-latest
    env:
      # workflow_dispatch の入力 (github.event.inputs.tag) があればそれを、無ければ push タグ (github.ref_name) を利用
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # 変更履歴 (過去タグ差分) のため全履歴取得
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: Cache Swift packages
      uses: actions/cache@v3
      with:
        path: .build
        key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-
          
    - name: Resolve dependencies
      run: swift package resolve
      
    - name: Build for release
      run: swift build -c release --arch arm64 --arch x86_64 -Xswiftc -parse-as-library
      
    - name: Create artifacts directory
      run: mkdir -p artifacts
      
    - name: Copy binary to artifacts
      run: |
        cp .build/apple/Products/Release/apple-calendar artifacts/
        chmod +x artifacts/apple-calendar

    - name: Import Developer ID certificate
      if: env.RELEASE_TAG != ''
      env:
        CERT_P12_BASE64: ${{ secrets.CERT_P12_BASE64 }}
        CERT_P12_PASSWORD: ${{ secrets.CERT_P12_PASSWORD }}
      run: |
        set -euo pipefail
        echo "$CERT_P12_BASE64" | base64 --decode > dev_id_cert.p12
        security create-keychain -p temp build.keychain
        security import dev_id_cert.p12 -k build.keychain -P "$CERT_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
        security list-keychains -d user -s build.keychain $(security list-keychains -d user | sed 's/[ "]//g')
        security unlock-keychain -p temp build.keychain
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k temp build.keychain
        security find-identity -p codesigning -v | grep "Developer ID Application" || { echo 'Developer ID Application identity not found'; exit 1; }

    - name: Codesign binary
      env:
        DEV_ID_CERT_ID: ${{ secrets.DEV_ID_CERT_ID }}
      run: |
        set -euo pipefail
        codesign --force --options runtime --timestamp --sign "$DEV_ID_CERT_ID" artifacts/apple-calendar
        codesign --verify --deep --strict --verbose=2 artifacts/apple-calendar
        lipo -info artifacts/apple-calendar || true

    - name: Prepare zip for notarization
      run: |
        set -euo pipefail
        (cd artifacts && zip -r apple-calendar.zip apple-calendar README.md > /dev/null)
        ls -lh artifacts/apple-calendar.zip

    - name: Configure notarytool credentials
      env:
        AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
        AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        AC_API_PRIVATE_KEY: ${{ secrets.AC_API_PRIVATE_KEY }}
      run: |
        set -euo pipefail
        # Secret はプレーン PEM (改行含む) を想定。必要であれば \n エスケープも解釈。
        printf "%b" "$AC_API_PRIVATE_KEY" > AuthKey.p8
        xcrun notarytool store-credentials \
          --key AuthKey.p8 \
          --key-id "$AC_API_KEY_ID" \
          --issuer "$AC_API_ISSUER_ID" \
          AC_PROFILE

    - name: Notarize (submit & wait)
      run: |
        set -euo pipefail
        xcrun notarytool submit artifacts/apple-calendar.zip --keychain-profile AC_PROFILE --wait --timeout 15m
   
    - name: Create usage README
      run: |
        cat > artifacts/README.md << 'EOF'
        # apple-calendar-cli
        
        One-shot macOS Calendar (EventKit) JSON exporter.
        
        ## Quick Start
        ```bash
        ./apple-calendar --pretty
        ```
        
        ## Filtering Examples
        ```bash
        ./apple-calendar --exclude-all-day
        ./apple-calendar --exclude-long-event
        ./apple-calendar --calendars "Work,Private" --limit 10
        ```
        
        ## Build From Source
        ```bash
        swift build -c release
        ./.build/release/apple-calendar
        ```
        
        ## License
        MIT
        EOF
        
        
    - name: Create archive (final notarized)
      run: |
        set -euo pipefail
        cd artifacts
        tar -czf ../apple-calendar-cli-${RELEASE_TAG}-universal.tar.gz apple-calendar README.md
        cd ..
        
    - name: Generate release notes (with changelog)
      id: release_notes
      run: |
        set -euo pipefail
        TAG="${RELEASE_TAG}"
        # 直近の一つ前のタグを取得 (存在しなければ空文字)
        PREV_TAG=$(git tag --sort=-creatordate | grep -v "^$TAG$" | head -n1 || true)
        COMPARE_URL=""
        CHANGELOG=""
        if [ -n "${PREV_TAG}" ]; then
          COMPARE_URL="https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${TAG}"
          # プレーンなコミットメッセージ一覧 (マージコミット除外)
          CHANGELOG=$(git log "${PREV_TAG}..${TAG}" --pretty=format:'- %s (%h)' --no-merges || true)
          if [ -z "${CHANGELOG}" ]; then
            CHANGELOG="(No commits between ${PREV_TAG} and ${TAG})"
          fi
        else
          # 初回リリース (タグ一つのみ)
          CHANGELOG=$(git log --pretty=format:'- %s (%h)' --no-merges | tail -n 50)
        fi

        cat > release_notes.md <<EOF
        # apple-calendar-cli ${TAG}

        macOS Calendar (EventKit) one-shot exporter. Human-readable text or JSON.

        ## ✨ Highlights
        - Locale override: `--locale ja_JP / en_US` (default: system locale)
        - Text output refinements (same-day end date omission, `Title (Calendar)` placement)
        - Relative range parsing: +1h30m, -2d, +365d
        - Truncation notice when `--limit` cuts results
        - Filters: `--exclude-all-day`, `--exclude-long-event`
        - Universal binary (arm64 + x86_64), codesigned & notarized

        ## � Changelog
        Previous tag: ${PREV_TAG:-N/A}
        ${COMPARE_URL:+Compare: ${COMPARE_URL}}

        ${CHANGELOG}

        ## �🔧 Usage
        ```bash
        ./apple-calendar --to +7d --limit 0
        ./apple-calendar --format json --pretty
        ./apple-calendar --locale en_US --from +0 --to +1d2h30m
        ./apple-calendar --calendars "Work,Personal" --exclude-all-day
        ```

        ## Text Format
        `MM/dd(E) HH:mm - HH:mm | Title (Calendar)[AllDay]`
        - Same-day: end time only
        - Cross-day: full dates

        ## JSON Fields
        `id, calendar, title, location, notes, isAllDay, start, end, startFormatted, endFormatted, url, attendees`

        ## Install
        1. Download & extract: `apple-calendar-cli-${TAG}-universal.tar.gz`
        2. Grant Calendar permission on first run
        3. Run `./apple-calendar --help`

        ## Requirements
        - macOS 13.0+

        ## Security
        - Developer ID signed & notarized

        ## License
        MIT
        EOF

        echo "notes<<EOF" >> $GITHUB_OUTPUT
        cat release_notes.md >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        name: ${{ env.RELEASE_TAG }}
        body: ${{ steps.release_notes.outputs.notes }}
        files: |
          apple-calendar-cli-${{ env.RELEASE_TAG }}-universal.tar.gz
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}