name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true
        default: '0.0.1'

jobs:
  build-and-release:
    runs-on: macos-latest
    env:
      # workflow_dispatch の入力 (github.event.inputs.tag) があればそれを、無ければ push タグ (github.ref_name) を利用
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: Cache Swift packages
      uses: actions/cache@v3
      with:
        path: .build
        key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-
          
    - name: Resolve dependencies
      run: swift package resolve
      
    - name: Build for release
      run: swift build -c release --arch arm64 --arch x86_64 -Xswiftc -parse-as-library
      
    - name: Create artifacts directory
      run: mkdir -p artifacts
      
    - name: Copy binary to artifacts
      run: |
        cp .build/apple/Products/Release/apple-calendar artifacts/
        chmod +x artifacts/apple-calendar
        
    - name: Create usage README
      run: |
        cat > artifacts/README.md << 'EOF'
        # apple-calendar-cli
        
        One-shot macOS Calendar (EventKit) JSON exporter.
        
        ## Quick Start
        ```bash
        ./apple-calendar --pretty
        ```
        
        ## Filtering Examples
        ```bash
        ./apple-calendar --exclude-all-day
        ./apple-calendar --exclude-long-event
        ./apple-calendar --calendars "Work,Private" --limit 10
        ```
        
        ## Build From Source
        ```bash
        swift build -c release
        ./.build/release/apple-calendar
        ```
        
        ## License
        MIT
        EOF
        
        
    - name: Create archive
      run: |
        cd artifacts
        tar -czf ../apple-calendar-cli-${RELEASE_TAG}-universal.tar.gz *
        cd ..
        
    - name: Generate release notes
      id: release_notes
      run: |
        TAG="${RELEASE_TAG}"
        # ヒアドキュメントのクォートを外して ${TAG} を展開可能にする
        cat > release_notes.md <<EOF
        # apple-calendar-cli ${TAG}

        ## Features
        - Apple Calendar CLI for macOS (EventKit)
        - Calendar name filtering
        - Optional exclusion of all-day and long events
        - Pretty-print JSON output option
        - Universal binary (arm64 + x86_64)

        ## Installation
        1. Download and extract `apple-calendar-cli-${TAG}-universal.tar.gz`
        2. Grant calendar permission on first run
        3. Execute `./apple-calendar --help`

        ## System Requirements
        - macOS 13.0 or later
        - Calendar access permissions
        EOF

        echo "notes<<EOF" >> $GITHUB_OUTPUT
        cat release_notes.md >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        name: v${{ env.RELEASE_TAG }}
        body: ${{ steps.release_notes.outputs.notes }}
        files: |
          apple-calendar-cli-${{ env.RELEASE_TAG }}-universal.tar.gz
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}