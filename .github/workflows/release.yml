name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true
        default: 'v0.0.1'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    env:
      # workflow_dispatch の入力 (github.event.inputs.tag) があればそれを、無ければ push タグ (github.ref_name) を利用
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0  # 変更履歴 (過去タグ差分) のため全履歴取得

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: Cache Swift packages
      uses: actions/cache@v5
      with:
        path: .build
        key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-
          
    - name: Resolve dependencies
      run: swift package resolve
      
    - name: Inject version into source code
      run: |
        # Extract version from tag (remove 'v' prefix if present)
        VERSION=$(echo "$RELEASE_TAG" | sed 's/^v//')
        echo "Injecting version: $VERSION"
        
        # Update BuildInfo.version in main.swift
        sed -i '' "s/static let version = \"dev\"/static let version = \"$VERSION\"/" Sources/AppleCalendarCLI/main.swift
        
        # Verify the change
        grep "static let version" Sources/AppleCalendarCLI/main.swift
      
    - name: Build for release
      run: swift build -c release --arch arm64 --arch x86_64
      
    - name: Create artifacts directory
      run: mkdir -p artifacts
      
    - name: Copy binary to artifacts
      run: |
        cp .build/apple/Products/Release/apple-calendar artifacts/
        chmod +x artifacts/apple-calendar

    - name: Import Developer ID certificate
      if: env.RELEASE_TAG != ''
      env:
        CERT_P12_BASE64: ${{ secrets.CERT_P12_BASE64 }}
        CERT_P12_PASSWORD: ${{ secrets.CERT_P12_PASSWORD }}
      run: |
        set -euo pipefail
        echo "$CERT_P12_BASE64" | base64 --decode > dev_id_cert.p12
        security create-keychain -p temp build.keychain
        security import dev_id_cert.p12 -k build.keychain -P "$CERT_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
        security list-keychains -d user -s build.keychain $(security list-keychains -d user | sed 's/[ "]//g')
        security unlock-keychain -p temp build.keychain
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k temp build.keychain
        security find-identity -p codesigning -v | grep "Developer ID Application" || { echo 'Developer ID Application identity not found'; exit 1; }

    - name: Codesign binary
      env:
        DEV_ID_CERT_ID: ${{ secrets.DEV_ID_CERT_ID }}
      run: |
        set -euo pipefail
        codesign --force --options runtime --timestamp --sign "$DEV_ID_CERT_ID" artifacts/apple-calendar
        codesign --verify --deep --strict --verbose=2 artifacts/apple-calendar
        lipo -info artifacts/apple-calendar || true

    - name: Prepare zip for notarization
      run: |
        set -euo pipefail
        (cd artifacts && zip -r apple-calendar.zip apple-calendar README.md > /dev/null)
        ls -lh artifacts/apple-calendar.zip

    - name: Configure notarytool credentials
      env:
        AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
        AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        AC_API_PRIVATE_KEY: ${{ secrets.AC_API_PRIVATE_KEY }}
      run: |
        set -euo pipefail
        # Secret はプレーン PEM (改行含む) を想定。必要であれば \n エスケープも解釈。
        printf "%b" "$AC_API_PRIVATE_KEY" > AuthKey.p8
        xcrun notarytool store-credentials \
          --key AuthKey.p8 \
          --key-id "$AC_API_KEY_ID" \
          --issuer "$AC_API_ISSUER_ID" \
          AC_PROFILE

    - name: Notarize (submit & wait)
      run: |
        set -euo pipefail
        xcrun notarytool submit artifacts/apple-calendar.zip --keychain-profile AC_PROFILE --wait --timeout 15m
   
    - name: Create usage README
      run: |
        cat > artifacts/README.md << 'EOF'
        # apple-calendar-cli
        
        One-shot macOS Calendar (EventKit) JSON exporter.
        
        ## Quick Start
        ```bash
        ./apple-calendar --pretty
        ```
        
        ## Filtering Examples
        ```bash
        ./apple-calendar --exclude-all-day
        ./apple-calendar --exclude-long-event
        ./apple-calendar --calendars "Work,Private" --limit 10
        ```
        
        ## Build From Source
        ```bash
        swift build -c release
        ./.build/release/apple-calendar
        ```
        
        ## License
        MIT
        EOF

    - name: Create archive (final notarized)
      run: |
        set -euo pipefail
        cd artifacts
        tar -czf ../apple-calendar-cli-${RELEASE_TAG}-universal.tar.gz apple-calendar README.md
        cd ..

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        name: ${{ env.RELEASE_TAG }}
        generate_release_notes: true
        files: |
          apple-calendar-cli-${{ env.RELEASE_TAG }}-universal.tar.gz
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Compute SHA256 for Homebrew formula
      id: brew_sha
      run: |
        set -euo pipefail
        FILE="apple-calendar-cli-${RELEASE_TAG}-universal.tar.gz"
        if [ ! -f "$FILE" ]; then
          echo "File $FILE not found" >&2
          exit 1
        fi
        SHA256=$(shasum -a 256 "$FILE" | awk '{print $1}')
        echo "sha256=$SHA256" >> $GITHUB_OUTPUT
        echo "SHA256=$SHA256" >> $GITHUB_ENV

    - name: Generate GitHub App token
      id: app_token
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ vars.G_BUMP_BOT_ID }}
        private-key: ${{ secrets.G_BUMP_BOT_PRIVATEKEY }}
        owner: ${{ github.repository_owner }}
        repositories: homebrew-etc
        permission-contents: write

    - name: Update Homebrew tap (legnoh/homebrew-etc)
      if: env.RELEASE_TAG != ''
      run: |
        set -euo pipefail
        REPO="legnoh/homebrew-etc"
        TMP=$(mktemp -d)
        git clone "https://x-access-token:${{ steps.app_token.outputs.token }}@github.com/${REPO}.git" "$TMP"
        VERSION="${RELEASE_TAG#v}"
        FORMULA_NAME="apple-calendar-cli"
        CLASS_NAME="AppleCalendarCli"
        FORMULA_PATH="$TMP/Formula/${FORMULA_NAME}.rb"
        URL="https://github.com/legnoh/apple-calendar-cli/releases/download/${RELEASE_TAG}/apple-calendar-cli-${RELEASE_TAG}-universal.tar.gz"
        SHA256="${{ steps.brew_sha.outputs.sha256 }}"
        if [ -z "$SHA256" ]; then
          echo "SHA256 not resolved" >&2
          exit 1
        fi
        mkdir -p "$(dirname "$FORMULA_PATH")"
        cat > "$FORMULA_PATH" <<EOF
        class ${CLASS_NAME} < Formula
          desc "One-shot macOS Calendar (EventKit) exporter (text/JSON)"
          homepage "https://github.com/legnoh/apple-calendar-cli"
          url "${URL}"
          version "${VERSION}"
          sha256 "${SHA256}"
          license "MIT"

          def install
            bin.install "apple-calendar"
            # Optional: ship README (not required)
            (prefix/"README.txt").write <<~EOS
              See: https://github.com/legnoh/apple-calendar-cli
            EOS
          end

          test do
            system "#{bin}/apple-calendar", "--help"
          end
        end
        EOF
        cd "$TMP"
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add "Formula/${FORMULA_NAME}.rb"
        git commit -m "${FORMULA_NAME} ${RELEASE_TAG} (automated)"
        git push origin HEAD:main
        cd -
