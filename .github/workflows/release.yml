name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true
        default: 'v1.0.0'

jobs:
  build-and-release:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: Cache Swift packages
      uses: actions/cache@v3
      with:
        path: .build
        key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-
          
    - name: Resolve dependencies
      run: swift package resolve
      
    - name: Build for release
      run: swift build -c release --arch arm64 --arch x86_64
      
    - name: Create artifacts directory
      run: mkdir -p artifacts
      
    - name: Copy binary to artifacts
      run: |
        cp .build/apple/Products/Release/mcjs artifacts/
        chmod +x artifacts/mcjs
        
    - name: Create launch script
      run: |
        cat > artifacts/launch_terminal.sh << 'EOF'
        #!/bin/bash
        
        # Get the directory of this script
        DIR="$( cd "$( dirname "${BASH_SOURCE[0]}" )" &> /dev/null && pwd )"
        
        # Launch mcjs in a new Terminal tab
        osascript -e "
        tell application \"Terminal\"
            if not (exists window 1) then reopen
            activate
            do script \"cd '$DIR' && echo '🚀 Starting mcjs...' && ./mcjs\" in window 1
        end tell
        "
        
        echo "✅ Terminal tab opened. Server should be starting..."
        EOF
        chmod +x artifacts/launch_terminal.sh
        
    - name: Create README for release
      run: |
        cat > artifacts/README.md << 'EOF'
        # mcjs
        
        macOS Calendar JSON API Server for Grafana integration.
        
        ## Setup
        
        1. Create configuration file:
        ```bash
        mkdir -p ~/.mcjs
        cat > ~/.mcjs/config.yaml << 'YAML'
        calendars:
          - "Calendar Name 1"
          - "Calendar Name 2"
        timezone: "Asia/Tokyo"
        YAML
        ```
        
        2. Grant calendar access:
        - Open System Settings > Privacy & Security > Calendar
        - Allow mcjs or Terminal to access Calendar
        
        ## Usage
        
        ### Option 1: Direct execution
        ```bash
        ./mcjs
        ```
        
        ### Option 2: Launch in Terminal.app (Recommended for calendar permissions)
        ```bash
        ./launch_terminal.sh
        ```
        
        ## API Endpoints
        
        - `GET /calendars` - List available calendars
        - `GET /events` - Query events with parameters (from, to, calendars)
        - `GET /upcoming` - Get next 5 upcoming events (excludes all-day events)
        - `GET /healthz` - Health check
        
        ## Configuration
        
        Environment variables:
        - `HOST` - Bind address (default: 127.0.0.1)
        - `PORT` - Port number (default: 8620)
        - `CORS_ORIGIN` - CORS origin (default: all origins)
        
        ## Examples
        
        ```bash
        # Get upcoming events
        curl http://localhost:8620/upcoming | jq
        
        # Get events for specific time range
        curl "http://localhost:8620/events?from=1696588800000&to=1696675200000" | jq
        ```
        EOF
        
    - name: Create archive
      run: |
        cd artifacts
        tar -czf ../mcjs-${{ github.ref_name }}-universal.tar.gz *
        cd ..
        
    - name: Generate release notes
      id: release_notes
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          TAG="${{ github.event.inputs.tag }}"
        else
          TAG="${{ github.ref_name }}"
        fi
        
        cat > release_notes.md << EOF
        # mcjs ${TAG}
        
        ## Features
        - macOS Calendar integration via EventKit
        - JSON API for Grafana integration
        - Configurable calendar filtering
        - Timezone support
        - All-day event filtering
        - Long-term event display rules (3-hour limit)
        
        ## Installation
        1. Download and extract \`mcjs-${TAG}-universal.tar.gz\`
        2. Create configuration file at \`~/.mcjs/config.yaml\`
        3. Grant calendar permissions in System Settings
        4. Run \`./launch_terminal.sh\` or \`./mcjs\`
        
        ## System Requirements
        - macOS 13.0 or later
        - Calendar access permissions
        
        ## API Documentation
        See README.md in the archive for detailed API usage.
        EOF
        
        echo "notes<<EOF" >> $GITHUB_OUTPUT
        cat release_notes.md >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
        name: mcjs ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
        body: ${{ steps.release_notes.outputs.notes }}
        files: |
          mcjs-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}-universal.tar.gz
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}